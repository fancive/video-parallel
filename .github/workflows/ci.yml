name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check, test, build, and package
        run: npm run package

      - name: Upload extension package
        uses: actions/upload-artifact@v6
        with:
          name: video-parallel-${{ github.sha }}
          path: release/video-parallel-v*.zip
          if-no-files-found: error
          retention-days: 14

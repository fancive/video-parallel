<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="562" viewBox="0 0 1620 562" role="img" aria-labelledby="outlineTitle outlineDescription"><title id="outlineTitle">可靠的 AI 智能体：从模型能力到上下文体系 — 全文架构图</title><desc id="outlineDescription">中心主题连接全部 6 个章节，每章连接其子主题。章节按编号阅读，先左后右。连线表示所属关系，不表示因果。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"><path d="M650,281 C620,281 620,108 590,108" fill="none" stroke="#2e5aac" stroke-width="2.5"/><path d="M330,108 C325,108 325,98 320,98" fill="none" stroke="#2e5aac" stroke-width="1.4"/><path d="M20,98 H320" stroke="#2e5aac" stroke-width="1.2" opacity="0.55"/><path d="M330,108 C325,108 325,166 320,166" fill="none" stroke="#2e5aac" stroke-width="1.4"/><path d="M20,166 H320" stroke="#2e5aac" stroke-width="1.2" opacity="0.55"/><path d="M650,281 C620,281 620,272 590,272" fill="none" stroke="#087b72" stroke-width="2.5"/><path d="M330,272 C325,272 325,272 320,272" fill="none" stroke="#087b72" stroke-width="1.4"/><path d="M20,272 H320" stroke="#087b72" stroke-width="1.2" opacity="0.55"/><path d="M330,272 C325,272 325,320 320,320" fill="none" stroke="#087b72" stroke-width="1.4"/><path d="M20,320 H320" stroke="#087b72" stroke-width="1.2" opacity="0.55"/><path d="M650,281 C620,281 620,426 590,426" fill="none" stroke="#8553a0" stroke-width="2.5"/><path d="M330,426 C325,426 325,426 320,426" fill="none" stroke="#8553a0" stroke-width="1.4"/><path d="M20,426 H320" stroke="#8553a0" stroke-width="1.2" opacity="0.55"/><path d="M330,426 C325,426 325,474 320,474" fill="none" stroke="#8553a0" stroke-width="1.4"/><path d="M20,474 H320" stroke="#8553a0" stroke-width="1.2" opacity="0.55"/><path d="M910,281 C940,281 940,118 970,118" fill="none" stroke="#b26724" stroke-width="2.5"/><path d="M1230,118 C1260,118 1260,98 1290,98" fill="none" stroke="#b26724" stroke-width="1.4"/><path d="M1290,98 H1590" stroke="#b26724" stroke-width="1.2" opacity="0.55"/><path d="M1230,118 C1260,118 1260,166 1290,166" fill="none" stroke="#b26724" stroke-width="1.4"/><path d="M1290,166 H1590" stroke="#b26724" stroke-width="1.2" opacity="0.55"/><path d="M910,281 C940,281 940,262 970,262" fill="none" stroke="#2e5aac" stroke-width="2.5"/><path d="M1230,262 C1260,262 1260,252 1290,252" fill="none" stroke="#2e5aac" stroke-width="1.4"/><path d="M1290,252 H1590" stroke="#2e5aac" stroke-width="1.2" opacity="0.55"/><path d="M1230,262 C1260,262 1260,300 1290,300" fill="none" stroke="#2e5aac" stroke-width="1.4"/><path d="M1290,300 H1590" stroke="#2e5aac" stroke-width="1.2" opacity="0.55"/><path d="M910,281 C940,281 940,406 970,406" fill="none" stroke="#087b72" stroke-width="2.5"/><path d="M1230,406 C1260,406 1260,386 1290,386" fill="none" stroke="#087b72" stroke-width="1.4"/><path d="M1290,386 H1590" stroke="#087b72" stroke-width="1.2" opacity="0.55"/><path d="M1230,406 C1260,406 1260,454 1290,454" fill="none" stroke="#087b72" stroke-width="1.4"/><path d="M1290,454 H1590" stroke="#087b72" stroke-width="1.2" opacity="0.55"/><g><title>为什么只升级模型还不够</title><rect x="330" y="73" width="260" height="70" rx="8" fill="white" stroke="#2e5aac" stroke-width="2"/><text x="346" y="97" fill="#2e5aac" font-size="12" font-weight="650"><tspan x="346" dy="0">1 · 00:00</tspan></text><text x="346" y="122" fill="#203040" font-size="18" font-weight="600"><tspan x="346" dy="0">为什么只升级模型还不够</tspan></text></g><text x="28" y="60" fill="#354b60" font-size="16" font-weight="400"><tspan x="28" dy="0">任务状态不断变化，静态知识不能覆盖当</tspan><tspan x="28" dy="23">前现场</tspan></text><text x="28" y="128" fill="#354b60" font-size="16" font-weight="400"><tspan x="28" dy="0">缺失关键上下文时，模型能力难以转化为</tspan><tspan x="28" dy="23">可靠行动</tspan></text><g><title>上下文来自哪里</title><rect x="330" y="237" width="260" height="70" rx="8" fill="white" stroke="#087b72" stroke-width="2"/><text x="346" y="261" fill="#087b72" font-size="12" font-weight="650"><tspan x="346" dy="0">2 · 05:00</tspan></text><text x="346" y="286" fill="#203040" font-size="18" font-weight="600"><tspan x="346" dy="0">上下文来自哪里</tspan></text></g><text x="28" y="234" fill="#354b60" font-size="16" font-weight="400"><tspan x="28" dy="0">历史文档提供稳定背景，实时数据描述当</tspan><tspan x="28" dy="23">前状态</tspan></text><text x="28" y="302" fill="#354b60" font-size="16" font-weight="400"><tspan x="28" dy="0">组合多个来源时保留出处与更新时间</tspan></text><g><title>从检索走向持续供给</title><rect x="330" y="391" width="260" height="70" rx="8" fill="white" stroke="#8553a0" stroke-width="2"/><text x="346" y="415" fill="#8553a0" font-size="12" font-weight="650"><tspan x="346" dy="0">3 · 10:00</tspan></text><text x="346" y="440" fill="#203040" font-size="18" font-weight="600"><tspan x="346" dy="0">从检索走向持续供给</tspan></text></g><text x="28" y="388" fill="#354b60" font-size="16" font-weight="400"><tspan x="28" dy="0">单次检索解决一次问题，持续供给跟随任</tspan><tspan x="28" dy="23">务变化</tspan></text><text x="28" y="456" fill="#354b60" font-size="16" font-weight="400"><tspan x="28" dy="0">按任务选择信息，避免堆入无关材料</tspan></text><g><title>建立独立的上下文层</title><rect x="970" y="83" width="260" height="70" rx="8" fill="white" stroke="#b26724" stroke-width="2"/><text x="986" y="107" fill="#b26724" font-size="12" font-weight="650"><tspan x="986" dy="0">4 · 15:00</tspan></text><text x="986" y="132" fill="#203040" font-size="18" font-weight="600"><tspan x="986" dy="0">建立独立的上下文层</tspan></text></g><text x="1298" y="80" fill="#354b60" font-size="16" font-weight="400"><tspan x="1298" dy="0">获取、清洗与交付信息形成清晰分工</tspan></text><text x="1298" y="128" fill="#354b60" font-size="16" font-weight="400"><tspan x="1298" dy="0">应用团队专注任务逻辑，基础层维护信息</tspan><tspan x="1298" dy="23">质量</tspan></text><g><title>权限和来源不能丢</title><rect x="970" y="227" width="260" height="70" rx="8" fill="white" stroke="#2e5aac" stroke-width="2"/><text x="986" y="251" fill="#2e5aac" font-size="12" font-weight="650"><tspan x="986" dy="0">5 · 20:00</tspan></text><text x="986" y="276" fill="#203040" font-size="18" font-weight="600"><tspan x="986" dy="0">权限和来源不能丢</tspan></text></g><text x="1298" y="234" fill="#354b60" font-size="16" font-weight="400"><tspan x="1298" dy="0">信息可用不代表当前任务有权访问</tspan></text><text x="1298" y="282" fill="#354b60" font-size="16" font-weight="400"><tspan x="1298" dy="0">保留引用和限制条件，方便核对与纠错</tspan></text><g><title>如何判断是否有效</title><rect x="970" y="371" width="260" height="70" rx="8" fill="white" stroke="#087b72" stroke-width="2"/><text x="986" y="395" fill="#087b72" font-size="12" font-weight="650"><tspan x="986" dy="0">6 · 25:00</tspan></text><text x="986" y="420" fill="#203040" font-size="18" font-weight="600"><tspan x="986" dy="0">如何判断是否有效</tspan></text></g><text x="1298" y="368" fill="#354b60" font-size="16" font-weight="400"><tspan x="1298" dy="0">用真实任务检查新鲜度、可追溯性与权限</tspan></text><text x="1298" y="416" fill="#354b60" font-size="16" font-weight="400"><tspan x="1298" dy="0">失败案例用于调整供给流程，而非只修改</tspan><tspan x="1298" dy="23">提示词</tspan></text><rect x="650" y="230" width="260" height="102" rx="16" fill="#203f74"/><text x="670" y="268" fill="#ffffff" font-size="22" font-weight="650"><tspan x="670" dy="0">可靠的 AI 智能体：从</tspan><tspan x="670" dy="29">模型能力到上下文体系</tspan></text></g></svg>
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>全文架构图 · video-parallel</title>
    <link rel="stylesheet" href="outline.css">
    <script src="outline.js" defer></script>
  </head>
  <body>
    <header>
      <div class="document-heading"><span>全文架构图</span><h1 id="documentTitle">正在打开…</h1></div>
      <nav aria-label="图形操作">
        <button id="zoomOut" aria-label="缩小">−</button>
        <output id="zoomLevel" aria-live="polite">100%</output>
        <button id="zoomIn" aria-label="放大">＋</button>
        <button id="fit">查看全图</button>
        <button id="actualSize">原始大小</button>
        <button id="exportSvg">导出 SVG</button>
      </nav>
    </header>
    <p id="documentInfo" class="document-info">中心主题 → 章节 → 子主题 · 连线表示内容层级</p>
    <p id="error" role="alert" hidden></p>
    <main id="canvas" tabindex="0" aria-label="全文架构图画布，可滚动查看" aria-describedby="documentInfo">
      <div id="drawing"></div>
    </main>
    <details id="textOutline"><summary>查看文字大纲</summary><div id="outlineText"></div></details>
  </body>
</html>

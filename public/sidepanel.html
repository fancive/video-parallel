<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>video-parallel</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-actions">
        <button
          class="toolbar-toggle"
          id="followButton"
          type="button"
          aria-label="跟随播放：已开启"
          aria-pressed="true"
          title="跟随播放"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 4v16M9 6l10 6-10 6V6Z" />
          </svg>
          <span id="followButtonLabel">跟随</span>
        </button>
        <button class="toolbar-process" id="processButton" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 7h-5V2M4 17h5v5M19 12a7 7 0 0 0-12-5L4 10M5 12a7 7 0 0 0 12 5l3-3" />
          </svg>
          <span id="processButtonLabel">开始处理</span>
        </button>
        <div class="font-size-control">
          <button
            class="icon-button font-size-button"
            id="fontSizeButton"
            type="button"
            aria-label="内容字号：标准"
            aria-controls="fontSizeMenu"
            aria-expanded="false"
          >
            <span aria-hidden="true">Aa</span>
          </button>
          <div class="font-size-menu" id="fontSizeMenu" role="group" aria-label="内容字号" hidden>
            <div>
              <strong>内容字号</strong>
              <span>仅调整侧面板</span>
            </div>
            <div class="font-size-options">
              <button type="button" data-font-size="small" aria-pressed="false">小</button>
              <button type="button" data-font-size="standard" aria-pressed="true">标准</button>
              <button type="button" data-font-size="large" aria-pressed="false">大</button>
            </div>
          </div>
        </div>
        <button class="icon-button" id="settingsButton" type="button" aria-label="打开模型设置">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.37a1.7 1.7 0 0 0-1 .63 1.7 1.7 0 0 0-.35 1.08V21h-4v-.08A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.23 15a1.7 1.7 0 0 0-.63-1 1.7 1.7 0 0 0-1.08-.35H2v-4h.52A1.7 1.7 0 0 0 4.2 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 8.6 4.23a1.7 1.7 0 0 0 1-.63A1.7 1.7 0 0 0 9.95 2.5V2h4v.52A1.7 1.7 0 0 0 15 4.2a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.37 8c.15.39.38.73.7.99.3.25.7.38 1.09.38H22v4h-.84A1.7 1.7 0 0 0 19.4 15Z" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section class="state" id="loadingState" aria-live="polite">
        <div class="scanline" aria-hidden="true"><span></span></div>
        <p class="eyebrow">Reading captions</p>
        <h1>正在准备视频概要</h1>
        <p>先读取视频已有字幕，再由你配置的模型识别章节。</p>
      </section>

      <section class="state" id="emptyState" hidden>
        <div class="empty-glyph" aria-hidden="true"><span>00:00</span></div>
        <p class="eyebrow">No caption track</p>
        <h1 id="emptyTitle">打开一个有字幕的 YouTube 视频</h1>
        <p id="emptyMessage">支持标准 watch 页面。Shorts、直播和无字幕视频暂不支持。</p>
        <button class="primary-button" id="retryButton" type="button">重新读取</button>
      </section>

      <section class="workspace" id="workspace" hidden>
        <section class="summary-section" aria-label="全文及章节概要">
          <div class="summary-runtime" role="status" aria-live="polite">
            <div class="runtime-status">
              <span class="status-dot" id="statusDot" aria-hidden="true"></span>
              <span id="statusText">字幕已就绪</span>
            </div>
            <div class="runtime-meta">
              <span class="token-usage" id="tokenUsage" hidden></span>
              <span class="chapter-count" id="chapterCount">等待处理</span>
            </div>
          </div>
          <div class="summary-list" id="summaryList" aria-live="polite"></div>
        </section>
        <footer class="command-bar" id="commandBar" hidden>
          <button type="button" id="copyButton">复制概要</button>
          <span aria-hidden="true"></span>
          <button type="button" id="exportButton">导出 Markdown</button>
        </footer>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script src="sidepanel.js"></script>
  </body>
</html>
